# 应用名称，主要用于日志标识。
spring.application.name=mongol-bridge-server
# ${环境变量:默认值}：没设置 SERVER_ADDRESS 时只接受本机连接。
# 手机联调时可设为 0.0.0.0，同时使用电脑局域网 IP 访问。
server.address=${SERVER_ADDRESS:127.0.0.1}
# 默认端口 8080；改端口时也要修改小程序 utils/config.js 的地址。
server.port=${SERVER_PORT:8080}
# 分别限制单文件和整个表单大小；请求还包含表单边界等额外数据。
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# 超过此阈值时，multipart 处理可能使用磁盘临时文件；这不是永久保存录音。
spring.servlet.multipart.file-size-threshold=2MB
# 默认错误响应不暴露异常详情和堆栈，已知错误由 ApiExceptionHandler 返回。
server.error.include-message=never
server.error.include-stacktrace=never
